<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NICESO CATALOG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{--r:#d71920;--bg:#fff;--card:#f6f6f7;--tx:#1b1b1d;--mut:#77777e;--bd:#ececef}
:root[data-theme=dark]{--r:#ff5a5f;--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mut:#9a9aa0;--bd:#2c2c2c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--r:#ff5a5f;--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mut:#9a9aa0;--bd:#2c2c2c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:22px;font-weight:300;letter-spacing:1.5px}h1 b{color:var(--r);font-weight:900}h2{margin:0 0 12px}
.top{padding:calc(12px + env(safe-area-inset-top)) 16px 4px;position:sticky;top:0;background:var(--bg);z-index:5}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=number],input[type=password],select{width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--card);margin:6px 0;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);cursor:pointer}
.chip.on{background:var(--r);color:#fff;border-color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer}
.im{position:relative;aspect-ratio:1;background:rgba(128,128,128,.15);display:flex;align-items:center;justify-content:center;font-size:36px}
.im img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;top:8px;background:var(--r);color:#fff;font-size:10px;padding:3px 8px;border-radius:20px}
.fv{position:absolute;right:6px;top:6px;border:0;background:rgba(255,255,255,.85);color:#d71920;width:32px;height:32px;border-radius:50%;font-size:18px}
.bd{padding:10px}.bd small{color:var(--mut)}.nm{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pr{font-weight:800;margin-top:4px}.red{color:var(--r)}s{color:var(--mut);font-size:12px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;border:0;background:0;padding:8px 0;font-size:11px;color:var(--mut)}nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--r);font-weight:700}
.pad{padding:16px}.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--r);color:#fff;font-weight:600;cursor:pointer}.btn.o{background:var(--card);color:var(--tx)}.btn.w{width:100%;margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.li img,.li .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}.li div{flex:1;min-width:0}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat div{background:var(--card);border-radius:16px;padding:18px;text-align:center}.stat b{display:block;font-size:30px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}.sheet.on{display:block}
.sheet>div{position:absolute;bottom:0;left:0;right:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
.big{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--card)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.kv span{color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .chip{flex:1;text-align:center;padding:8px 4px}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;display:none}
.empty{text-align:center;color:var(--mut);padding:40px 16px;grid-column:1/-1}
 :root{--bg:#f6f6f8;--card:#fff;--bd:#eeeef1;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
:root[data-theme=dark]{--bg:#0f0f10;--card:#1a1a1c;--bd:#2a2a2d;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f10;--card:#1a1a1c;--bd:#2a2a2d;--sh:none}}
h2{font-size:22px;font-weight:700;margin:0 0 14px}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-bottom:4px}
.sr{position:relative;margin:10px 0 2px}
.sr:before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-54%);font-size:21px;color:var(--mut)}
.sr input{-webkit-appearance:none;padding:14px 16px 14px 44px;border-radius:18px;background:var(--card);box-shadow:var(--sh);margin:0}
.chip{background:var(--card);border:0;box-shadow:var(--sh);padding:8px 16px;font-size:14px;transition:.15s}
.chip.on{background:var(--r);color:#fff;box-shadow:0 4px 12px rgba(215,25,32,.3)}
.hd{padding:6px 18px 0;color:var(--mut);font-size:13px}
.grid{gap:14px;padding:10px 16px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);transition:transform .15s}
.card:active{transform:scale(.97)}
.im{border-radius:0}
.fv{background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bd{padding:12px}.bd small{font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.nm{font-size:14px;font-weight:600}.pr{font-size:16px}
.empty{padding:60px 16px;font-size:15px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct{background:var(--card);border-radius:20px;padding:18px 16px;box-shadow:var(--sh);cursor:pointer}
.ct i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--r);color:#fff;font-style:normal;margin-bottom:12px}
.ct b{display:block}.ct small{color:var(--mut)}
.pf{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.av{width:52px;height:52px;border-radius:50%;background:var(--r);display:grid;place-items:center;font-size:24px;flex:none}
.sl{margin:20px 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--sh)}
.seg span{flex:1;text-align:center;padding:9px 0;border-radius:11px;cursor:pointer;font-size:14px}
.seg span.on{background:var(--r);color:#fff;font-weight:600}
nav{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:0;box-shadow:0 -1px 0 var(--bd)}
nav button{padding:9px 0 7px;font-size:11px}
nav button i{width:52px;margin:0 auto 2px;padding:3px 0;border-radius:14px;transition:.2s}
nav button.on i{background:rgba(215,25,32,.12)}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
nav{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));padding:8px;border:0;border-radius:999px;background:#0b0b0c;box-shadow:0 10px 30px rgba(0,0,0,.25);justify-content:space-between;gap:2px;-webkit-backdrop-filter:none;backdrop-filter:none}
nav button{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;min-width:44px;padding:0 10px;border-radius:999px;background:transparent;color:#e8e8ea;font-size:13px;font-weight:500;transition:background .25s,padding .25s}
nav button span{display:none;white-space:nowrap}
nav button.on{background:#2a2a2c;color:#fff;padding:0 14px}
nav button.on span{display:inline}
nav button.on svg{fill:currentColor}
nav button.on svg .l{fill:#2a2a2c}
nav button.on:after{content:none}
</style></head><body>
<div id="v"></div><div id="m" class="sheet"></div><div id="t"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2500)};
/* ===== Database online (Supabase) ===== */
const sb=supabase.createClient(CFG.url,CFG.key);let OFF=false;
const ok=r=>{if(r.error){toast('Gagal: '+r.error.message);return false}return true};
const fromRow=r=>({id:r.id,sku:r.sku,name:r.name,cat:r.cat,normal:+r.normal,promo:r.promo==null?null:+r.promo,on:!!r.promo_on,url:r.photo_url||'',hash:r.hash||''});




/* ===== State ===== */
let P=[],CATS=[];const S={tab:'home',q:'',cat:'',promo:false,admin:false,adm:'dash',fav:new Set(JSON.parse(localStorage.fav||'[]'))};
const prom=p=>p.on&&p.promo>0,cur=p=>prom(p)?p.promo:p.normal,pct=p=>p.normal>0?Math.round((p.normal-p.promo)/p.normal*100):0;
async function load(){try{let all=[],f=0;for(;;){const{data,error}=await sb.from('products').select('*').order('name').range(f,f+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;f+=1000}
 const c=await sb.from('categories').select('name');if(c.error)throw c.error;P=all.map(fromRow);CATS=c.data.map(x=>x.name);localStorage.cache=JSON.stringify({P,CATS});OFF=false}
 catch(e){const c=JSON.parse(localStorage.cache||'null');if(!c)throw e;P=c.P;CATS=c.CATS;if(!OFF)toast('Mode offline - memakai data tersimpan');OFF=true}
 CATS=[...new Set([...CATS,...P.map(p=>p.cat)])].filter(Boolean).sort()}

const price=p=>`<div class="pr ${prom(p)?'red':''}">${rp(cur(p))}</div>${prom(p)?`<s>${rp(p.normal)}</s>`:''}`;
const card=p=>`<div class=card onclick="detail('${p.id}')"><div class=im>${p.url?`<img loading=lazy src="${p.url}">`:'🖼'}${prom(p)?`<b class=badge>PROMO -${pct(p)}%</b>`:''}<button class=fv onclick="event.stopPropagation();fav('${p.id}')">${S.fav.has(p.id)?'♥':'♡'}</button></div><div class=bd><small>${esc(p.sku)}</small><div class=nm>${esc(p.name)}</div>${price(p)}</div></div>`;
function fav(id){S.fav.has(id)?S.fav.delete(id):S.fav.add(id);localStorage.fav=JSON.stringify([...S.fav]);render(true)}
/* ===== Navigasi ===== */
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cat:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',vis:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle class="l" cx="12" cy="13" r="3.5"/>',fav:'<path d="M12 20.5s-8-4.9-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 6.1-8 11-8 11z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>'};
const TABS=[['home','Beranda'],['cat','Kategori'],['vis','Visual'],['fav','Favorit'],['me','Profil']];
$('#nav').innerHTML=TABS.map(t=>`<button data-t=${t[0]} onclick="go('${t[0]}')"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[t[0]]}</svg><span>${t[1]}</span></button>`).join('');
const go=t=>{S.tab=t;render()};
function render(keep){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 if(keep&&S.tab==='home'&&$('#g')){grid();return}
 ({home,cat:cats,vis,fav:favs,me})[S.tab]()}
/* ===== Beranda ===== */
function home(){$('#v').innerHTML=`<div class=top><h1><b>NICESO</b> CATALOG</h1><div class=sr><input id=q type=search placeholder="Cari SKU atau nama barang" value="${esc(S.q)}"></div><div class=chips><span class="chip ${S.promo?'on':''}" onclick="S.promo=!S.promo;home()">🏷 Promo</span><span class="chip ${S.cat?'':'on'}" onclick="S.cat='';home()">Semua</span>${CATS.map(c=>`<span class="chip ${S.cat===c?'on':''}" onclick="S.cat=this.dataset.c;home()" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</div></div><div class=hd id=cn></div><div id=g class=grid></div>`;
 $('#q').oninput=e=>{S.q=e.target.value;grid()};grid()}
function grid(){const k=S.q.trim().toLowerCase();const l=P.filter(p=>(!S.cat||p.cat===S.cat)&&(!S.promo||prom(p))&&(!k||p.name.toLowerCase().includes(k)||p.sku.toLowerCase().includes(k)));
 if($('#cn'))$('#cn').textContent=l.length+' produk';$('#g').innerHTML=l.length?l.map(card).join(''):'<div class=empty>🔍<br>Produk tidak ditemukan</div>'}
function cats(){$('#v').innerHTML=`<div class=pad><h2>Kategori</h2>${CATS.length?`<div class=cg>${CATS.map(c=>`<div class=ct onclick="S.cat=this.dataset.c;S.promo=false;S.q='';go('home')" data-c="${esc(c)}"><i>▦</i><b>${esc(c)}</b><small>${P.filter(p=>p.cat===c).length} produk</small></div>`).join('')}</div>`:'<div class=empty>Belum ada kategori</div>'}</div>`}
function favs(){const l=P.filter(p=>S.fav.has(p.id));$('#v').innerHTML=`<div class=pad><h2>Favorit</h2></div><div class=grid>${l.length?l.map(card).join(''):'<div class=empty>♡<br>Belum ada favorit.<br>Ketuk ikon hati pada produk.</div>'}</div>`}
/* ===== Detail ===== */
function sheet(h){$('#m').innerHTML=`<div>${h}</div>`;$('#m').classList.add('on')}
const closeM=()=>$('#m').classList.remove('on');$('#m').onclick=e=>{if(e.target.id==='m')closeM()};
function detail(id){const p=P.find(x=>x.id===id);sheet(`${p.url?`<img class=big src="${p.url}">`:'<div class=big></div>'}<h2 style="margin-top:14px">${esc(p.name)}</h2><small style="color:var(--mut)">SKU: ${esc(p.sku)}</small><div style="font-size:24px;margin:10px 0">${price(p)}</div>${prom(p)?`<b class=badge style="position:static;display:inline-block">PROMO -${pct(p)}%</b>`:''}<div class=kv><span>Kategori</span>${esc(p.cat)}</div><div class=kv><span>Status harga</span>${prom(p)?'Harga Promo':'Harga Normal'}</div><div class=kv><span>Harga normal</span>${rp(p.normal)}</div>${p.promo>0?`<div class=kv><span>Harga promo</span>${rp(p.promo)}</div>`:''}<div class=row style="margin-top:14px"><button class="btn o" onclick="fav('${p.id}');detail('${p.id}')">${S.fav.has(p.id)?'♥ Hapus favorit':'♡ Favorit'}</button><button class=btn onclick="closeM()">Tutup</button></div>`)}
/* ===== Gambar & Visual Search ===== */
async function proc(file){const b=await createImageBitmap(file);const sc=Math.min(1,800/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*sc);c.height=Math.round(b.height*sc);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));return{blob,hash:hashOf(b)}}
function hashOf(b){const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(b,0,0,8,8);const d=x.getImageData(0,0,8,8).data,v=[];for(let i=0;i<64;i++)v.push(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]);const a=v.reduce((s,n)=>s+n)/64;return v.map(n=>n>=a?'1':'0').join('')}
const dist=(a,b)=>{if(!a||!b||a.length!==b.length)return 64;let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d};
function vis(){$('#v').innerHTML=`<div class=pad><h2>Visual Search</h2><div class=row><button class=btn onclick="$('#fc').click()">📷 Kamera</button><button class="btn o" onclick="$('#fg').click()">🖼 Upload foto</button></div><input id=fc type=file accept="image/*" capture=environment hidden><input id=fg type=file accept="image/*" hidden><div id=vr style="color:var(--mut);text-align:center;margin-top:24px">Foto barang untuk mencari produk yang mirip. Hasil terbaik: barang di tengah, latar polos, cahaya cukup.</div></div><div id=g class=grid></div>`;
 const h=async e=>{const f=e.target.files[0];if(!f)return;const{blob,hash}=await proc(f);const r=P.filter(p=>p.hash).sort((a,b)=>dist(hash,a.hash)-dist(hash,b.hash)).slice(0,12);
  $('#vr').innerHTML=`<img src="${URL.createObjectURL(blob)}" style="height:90px;border-radius:12px"><br>Produk paling mirip`;$('#g').innerHTML=r.length?r.map(card).join(''):'<div class=empty>Belum ada produk berfoto</div>'};
 $('#fc').onchange=h;$('#fg').onchange=h}
/* ===== Profil & Admin ===== */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('niceso'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function setTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;localStorage.theme=t;me()}
function me(){const t=localStorage.theme||'auto';
 let h=`<div class=pad><h2>Profil</h2><div class=pf><div class=av>${S.admin?'🛠':'👤'}</div><div><b>${S.admin?'Admin':'Pengunjung'}</b><br><small style="color:var(--mut)">${S.admin?'Bisa mengubah katalog':'Hanya melihat katalog'}</small></div></div><div class=sl>Tampilan</div><div class=seg>${['auto','light','dark'].map(x=>`<span class="${t===x?'on':''}" onclick="setTheme('${x}')">${{auto:'Otomatis',light:'Terang',dark:'Gelap'}[x]}</span>`).join('')}</div>`;
 if(!S.admin)h+=`<div class=sl>Login Admin</div><input id=em type=text placeholder="Email admin" autocapitalize=none><input id=pw type=password placeholder="Password"><button class="btn w" onclick="login()">Masuk</button><small style="color:var(--mut)">Hanya admin yang perlu login. Pengguna biasa cukup membuka katalog.</small>`;
 else{h+=`<div class=sl>Menu admin</div><div class=tabs>${[['dash','Dashboard'],['prod','Produk'],['kat','Kategori'],['data','Data']].map(x=>`<span class="chip ${S.adm===x[0]?'on':''}" onclick="S.adm='${x[0]}';me()">${x[1]}</span>`).join('')}</div>${admin()}<button class="btn o w" onclick="logout()">Keluar admin</button>`}
 $('#v').innerHTML=h+'</div>'}
async function chkAdmin(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data}=await sb.from('admins').select('user_id').eq('user_id',session.user.id);return !!(data&&data.length)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('Login gagal: '+error.message);if(!await chkAdmin()){await sb.auth.signOut();return toast('Akun ini bukan admin')}S.admin=true;me()}
async function logout(){await sb.auth.signOut();S.admin=false;me()}
function admin(){const a=S.adm;
 if(a==='dash')return`<div class=stat><div><b>${P.length}</b>Total Produk</div><div><b>${P.filter(prom).length}</b>Produk Promo</div><div><b>${CATS.length}</b>Kategori</div><div><b>${P.filter(p=>!p.url).length}</b>Tanpa Foto</div></div>`;
 if(a==='prod')return`<button class="btn w" onclick="formP()">+ Tambah Produk</button>${P.map(p=>`<div class=li>${p.url?`<img src="${p.url}">`:'<span class=ph></span>'}<div><b>${esc(p.name)}</b><br><small>${esc(p.sku)} • ${rp(cur(p))}${prom(p)?' (promo)':''}</small></div><button class="btn o" onclick="formP('${p.id}')">✎</button><button class="btn o" onclick="rm('${p.id}')">🗑</button></div>`).join('')}`;
 if(a==='kat')return`<div class=row><input id=nc type=text placeholder="Kategori baru"><button class=btn style="flex:none" onclick="addCat()">Tambah</button></div>${CATS.map(c=>`<div class=li><div>${esc(c)}</div><button class="btn o" onclick="delCat(this.dataset.c)" data-c="${esc(c)}">🗑</button></div>`).join('')}`;
 return`<button class="btn w" onclick="$('#xi').click()">⬆ Import Excel</button><input id=xi type=file accept=".xlsx,.xls" hidden onchange="impX(event)"><button class="btn o w" onclick="expX()">⬇ Export Excel</button><button class="btn o w" onclick="chpw()">🔑 Ganti password</button><small style="color:var(--mut)">Kolom Excel: SKU | Nama Barang | Kategori | Harga Normal | Harga Promo | Status (PROMO/NORMAL). SKU yang sudah ada diperbarui (foto tetap). Foto ditambahkan lewat edit produk.</small>`}
async function addCat(){const v=$('#nc').value.trim();if(!v)return;if(!ok(await sb.from('categories').upsert({name:v})))return;await load();me()}
async function delCat(c){if(!confirm('Hapus kategori "'+c+'"?'))return;if(!ok(await sb.from('categories').delete().eq('name',c)))return;await load();me()}
async function rm(id){if(!confirm('Hapus produk ini?'))return;if(!ok(await sb.from('products').delete().eq('id',id)))return;await sb.storage.from('products').remove([id+'.jpg']);await load();me()}
async function chpw(){const n=prompt('Password baru (min. 6 karakter)');if(!n)return;if(n.length<6)return toast('Terlalu pendek');if(ok(await sb.auth.updateUser({password:n})))toast('Password diganti')}
let F={};
function formP(id){const p=P.find(x=>x.id===id)||{};F={id:p.id,blob:null,hash:p.hash||'',url:p.url||''};
 sheet(`<h2>${id?'Edit':'Tambah'} Produk</h2><img id=pv class=big style="aspect-ratio:1.6" ${p.url?`src="${p.url}"`:''}><div class=row><button class="btn o" onclick="$('#pc').click()">📷 Kamera</button><button class="btn o" onclick="$('#pg').click()">🖼 Galeri</button></div><input id=pc type=file accept="image/*" capture=environment hidden><input id=pg type=file accept="image/*" hidden>
 <input id=fs type=text placeholder="SKU / Kode Barang" value="${esc(p.sku)}"><input id=fn type=text placeholder="Nama Barang" value="${esc(p.name)}"><input id=fk type=text list=dl placeholder="Kategori (pilih / ketik baru)" value="${esc(p.cat)}"><datalist id=dl>${CATS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <input id=fh type=number inputmode=numeric placeholder="Harga Normal" value="${p.normal??''}"><input id=fp type=number inputmode=numeric placeholder="Harga Promo (opsional)" value="${p.promo??''}"><label class=row style="margin:8px 0"><span style="flex:none"><input id=fo type=checkbox ${p.on?'checked':''}></span><span>Aktifkan harga promo</span></label>
 <div class=row><button class="btn o" onclick="closeM()">Batal</button><button id=sv class=btn onclick="saveP()">Simpan</button></div>`);
 const h=async e=>{const f=e.target.files[0];if(!f)return;const r=await proc(f);F.blob=r.blob;F.hash=r.hash;F.url=URL.createObjectURL(r.blob);$('#pv').src=F.url};$('#pc').onchange=h;$('#pg').onchange=h}
async function saveP(){const sku=$('#fs').value.trim(),name=$('#fn').value.trim(),cat=$('#fk').value.trim(),normal=parseFloat($('#fh').value),pr=$('#fp').value===''?null:parseFloat($('#fp').value),on=$('#fo').checked;
 if(!sku||!name||!cat)return toast('SKU, nama, dan kategori wajib diisi');if(isNaN(normal))return toast('Harga normal tidak valid');if(on&&!(pr>0))return toast('Isi harga promo atau matikan promo');
 if(P.some(p=>p.id!==F.id&&p.sku.toLowerCase()===sku.toLowerCase()))return toast('SKU sudah dipakai');
 const id=F.id||crypto.randomUUID();let url=F.url||null;$('#sv').disabled=true;
 try{if(F.blob){const up=await sb.storage.from('products').upload(id+'.jpg',F.blob,{upsert:true,contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;url=sb.storage.from('products').getPublicUrl(id+'.jpg').data.publicUrl+'?v='+Date.now()}
 const r=await sb.from('products').upsert({id,sku,name,cat,normal,promo:pr,promo_on:on,photo_url:url,hash:F.hash});if(r.error)throw r.error;
 await sb.from('categories').upsert({name:cat});await load();closeM();me();toast('Tersimpan')}catch(e){$('#sv').disabled=false;toast('Gagal: '+(e.message||e))}}
/* ===== Excel & Backup ===== */
async function saveFile(name,b64,mime){const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()){const{Filesystem,Share}=C.Plugins;const r=await Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await Share.share({title:name,url:r.uri})}else{const a=document.createElement('a');a.href=`data:${mime};base64,${b64}`;a.download=name;a.click()}}
async function expX(){if(typeof XLSX==='undefined')return toast('Library Excel belum termuat');const rows=[['SKU','Nama Barang','Kategori','Harga Normal','Harga Promo','Status (PROMO/NORMAL)'],...P.map(p=>[p.sku,p.name,p.cat,p.normal,p.promo??'',prom(p)?'PROMO':'NORMAL'])];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Produk');await saveFile('niceso_produk.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
async function impX(e){const f=e.target.files[0];if(!f)return;if(typeof XLSX==='undefined')return toast('Library Excel belum termuat');
 const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});const num=v=>{const x=parseFloat(String(v??'').replace(/[^0-9.]/g,''));return isNaN(x)?null:x};const m=new Map();
 for(const r of rows.slice(1)){const sku=String(r[0]??'').trim(),name=String(r[1]??'').trim();if(!sku||!name)continue;const pr=num(r[4]);m.set(sku,{sku,name,cat:String(r[2]||'Umum').trim(),normal:num(r[3])||0,promo:pr,promo_on:String(r[5]||'').toUpperCase()==='PROMO'&&pr>0})}
 const a=[...m.values()];toast('Mengimpor '+a.length+' produk...');
 for(let i=0;i<a.length;i+=300){if(!ok(await sb.from('products').upsert(a.slice(i,i+300),{onConflict:'sku'})))return}
 await sb.from('categories').upsert([...new Set(a.map(x=>x.cat))].map(name=>({name})));await load();me();toast(a.length+' produk diimpor')}

if(localStorage.theme&&localStorage.theme!=='auto')document.documentElement.dataset.theme=localStorage.theme;
(async()=>{try{await load()}catch(e){$('#v').innerHTML='<div class=pad>Tidak bisa memuat data. Periksa internet dan config.js.<br><small>'+esc(e.message||e)+'</small></div>';return}
 S.admin=await chkAdmin().catch(()=>false);render();
 const rf=async()=>{try{await load()}catch(e){return}if(S.tab==='home')render(true);else if(S.tab==='cat'||S.tab==='fav')render()};
 sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'products'},rf).subscribe();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)rf()})})();
</script></body></html>
