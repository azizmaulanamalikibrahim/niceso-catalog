}

/* ===== Database online (Supabase) ===== */
const sb=supabase.createClient(CFG.url,CFG.key);let OFF=false;
const ok=r=>{if(r.error){toast('Gagal: '+r.error.message);return false}return true};
const fromRow=r=>({id:r.id,sku:r.sku,name:r.name,cat:r.cat,normal:+r.normal,promo:r.promo==null?null:+r.promo,on:!!r.promo_on,url:r.photo_url||'',hash:r.hash||''});




/* ===== State ===== */
let P=[],CATS=[];const S={tab:'home',q:'',cat:'',promo:false,admin:false,adm:'dash',fav:new Set(JSON.parse(localStorage.fav||'[]'))};
const prom=p=>p.on&&p.promo>0,cur=p=>prom(p)?p.promo:p.normal,pct=p=>p.normal>0?Math.round((p.normal-p.promo)/p.normal*100):0;
async function load(){try{let all=[],f=0;for(;;){const{data,error}=await sb.from('products').select('*').order('name').range(f,f+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;f+=1000}
 const c=await sb.from('categories').select('name');if(c.error)throw c.error;P=all.map(fromRow);CATS=c.data.map(x=>x.name);localStorage.cache=JSON.stringify({P,CATS});OFF=false}
 catch(e){const c=JSON.parse(localStorage.cache||'null');if(!c)throw e;P=c.P;CATS=c.CATS;if(!OFF)toast('Mode offline - memakai data tersimpan');OFF=true}
 CATS=[...new Set([...CATS,...P.map(p=>p.cat)])].filter(Boolean).sort()}

async function registerAndroidBackHandler(){
 const C=window.Capacitor;
 if(!C||typeof C.isNativePlatform!=='function'||!C.isNativePlatform())return;
 if(window.__nicesoBackHandlerRegistered)return;
 const App=C.Plugins?.App;
 if(!App||typeof App.addListener!=='function'){
  console.error('Capacitor App plugin tidak tersedia pada WebView.');
  return;
 }
 window.__nicesoBackHandlerRegistered=true;
 try{await App.addListener('backButton',()=>handleAppBack(App));}
 catch(e){window.__nicesoBackHandlerRegistered=false;console.error('Gagal memasang Android Back Handler:',e)}
}
function render(keep){$('#nav').style.display=(S.tab==='me'&&S.admin)?'none':'flex';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 if(keep&&S.tab==='home'&&$('#g')){grid();return}
 ({home,cat:cats,vis,fav:favs,me})[S.tab]()}

const DRAWER_IC={all:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',promo:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.2"/><circle cx="17" cy="17" r="2.2"/>',set:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'};
function drawerItems(){return [['home','Beranda',IC.home],['all','Semua Produk',DRAWER_IC.all],['cat','Kategori Produk',IC.cat],['promo','Promo',DRAWER_IC.promo],['fav','Produk Favorit',IC.fav],['me','Pengaturan',DRAWER_IC.set],['about','Tentang NICESO CATALOG',DRAWER_IC.info]]}
function openDrawer(){
 const on=S.tab==='home'?(S.promo?'promo':'home'):S.tab;
 $('#drawer').innerHTML=`<div class=dr-ov onclick="closeDrawer()"></div><aside class=dr-pn><div class=dr-hd><img src="assets/brand-logo.png" alt="NICESO"><small>CATALOG · PRODUCT COLLECTION</small></div><div class=dr-ls>${drawerItems().map(i=>`<button type=button class="dr-it ${i[0]===on?'on':''}" onclick="drawerGo('${i[0]}')"><svg viewBox="0 0 24 24" aria-hidden="true">${i[2]}</svg><span>${i[1]}</span></button>`).join('')}</div><div class=dr-ft><b style="color:var(--tx)">NICESO CATALOG</b><br>Versi ${APP_VER}</div></aside>`;
 document.body.style.overflow='hidden';
 requestAnimationFrame(()=>requestAnimationFrame(()=>$('#drawer').classList.add('on')));
}
function closeDrawer(){$('#drawer').classList.remove('on');document.body.style.overflow=''}
function drawerGo(k){
 closeDrawer();
 if(k==='about')return infoSheet('about');
 const reset=()=>{S.q='';S.cat='';S.promo=false};
 const to=(t,f)=>{if(f)f();if(t===S.tab)render();else go(t);window.scrollTo(0,0)};
 if(k==='home')to('home',reset);
 else if(k==='all'){to('home',reset);setTimeout(()=>{const g=$('#g');if(g)g.scrollIntoView({behavior:'smooth'})},150)}
 else if(k==='promo')to('home',()=>{reset();S.promo=true});
 else to(k);
}
function infoSheet(k){
 if(k==='about'){sheet(`<h2>NICESO CATALOG</h2><div class=kv><span>Versi</span>${APP_VER}</div><div class=kv><span>Jumlah produk</span>${P.length}</div><div class=kv><span>Kategori</span>${CATS.length}</div><p style="color:var(--mut);font-size:13px;line-height:1.5">Katalog produk NICESO untuk melihat harga, promo, dan kode barang dengan cepat.</p><button class="btn o w" onclick="closeM()">Tutup</button>`);return}
 const E={notif:[HDR_IC.bell,'Notifikasi','Belum ada notifikasi','Pengumuman dan info terbaru dari NICESO akan tampil di sini.'],cart:[HDR_IC.bag,'Keranjang','Keranjang masih kosong','Produk yang Anda pilih akan tampil di sini.']};
 const e=E[k];if(!e)return;
 sheet(`<h2>${e[1]}</h2><div class=nf-empty><svg viewBox="0 0 24 24" aria-hidden="true">${e[0]}</svg><b style="color:var(--tx)">${e[2]}</b><p style="margin:6px 0 0;font-size:13px">${e[3]}</p></div><button class="btn o w" onclick="closeM()">Tutup</button>`);
}
/* ===== Beranda ===== */
function home(){
 const svg=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
 const iAll='<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>';
 const iPromo='<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.2"/><circle cx="17" cy="17" r="2.2"/>';
 const iCat='<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>';
 const iScan='<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 9v6M12 9v6M16 9v6"/>';
 const catTiles=`<button type="button" class="cat-tile ${S.promo?'on':''}" onclick="S.promo=!S.promo;home()">${svg(iPromo)}<span>Promo</span></button><button type="button" class="cat-tile ${S.cat?'':'on'}" onclick="S.cat='';home()">${svg(iAll)}<span>Semua</span></button>${CATS.map(c=>`<button type="button" class="cat-tile ${S.cat===c?'on':''}" onclick="S.cat=this.dataset.c;home()" data-c="${esc(c)}">${svg(iCat)}<span>${esc(c)}</span></button>`).join('')}`;
 $('#v').innerHTML=`<div class=top><div class=hdr><button type=button class=ib onclick="openDrawer()" aria-label="Menu">${svg(HDR_IC.menu)}</button><div class=hdr-brand><img src="assets/brand-logo.png" alt="NICESO"><small>PRODUCT COLLECTION</small></div><div class=hdr-r><button type=button class=ib onclick="infoSheet('notif')" aria-label="Notifikasi">${svg(HDR_IC.bell)}</button><button type=button class=ib onclick="infoSheet('cart')" aria-label="Keranjang">${svg(HDR_IC.bag)}</button></div></div><div class=sr><input id=q type=search placeholder="Cari SKU atau nama barang" value="${esc(S.q)}"><button class=scan-btn onclick="startBarcodeScan()" aria-label="Scan barcode" title="Scan barcode">${svg(iScan)}</button></div></div><div class=cat-grid>${catTiles}</div><div class=hd id=cn></div><div id=g class=grid></div>`;
 $('#q').oninput=e=>{S.q=e.target.value;grid()};grid()}
let barcodeReader=null,barcodeControls=null,scanBusy=false,scanSession=0;
async function startBarcodeScan(){
 if(!navigator.mediaDevices?.getUserMedia)return toast('Kamera tidak didukung di perangkat ini');
 if(!window.ZXingBrowser?.BrowserMultiFormatReader)return toast('Modul scan belum termuat. Periksa koneksi lalu muat ulang aplikasi.');
 const session=++scanSession;
 sheet(`<h2>Scan Barcode</h2><video id=scanVideo playsinline muted></video><div class=scan-help>Posisikan barcode di depan kamera. Pemindaian berlangsung otomatis.</div><button class="btn o w" onclick="stopBarcodeScan()">Tutup Kamera</button>`);
 try{
  const reader=new ZXingBrowser.BrowserMultiFormatReader();barcodeReader=reader;scanBusy=false;
  const controls=await reader.decodeFromVideoDevice(undefined,'scanVideo',(result,error)=>{
   if(session!==scanSession||!result||scanBusy)return;
   scanBusy=true;const code=String(result.getText()||'').trim();stopBarcodeScan();
   const found=P.find(p=>String(p.sku).trim().toLowerCase()===code.toLowerCase());
   if(found){S.q=found.sku;S.cat='';S.promo=false;S.tab='home';render();detail(found.id);toast('Produk ditemukan: '+found.sku)}
   else{S.q=code;S.cat='';S.promo=false;S.tab='home';render();toast('Barcode '+code+' tidak ditemukan di katalog')}
  });
  // Jika pengguna menutup scanner sebelum izin kamera selesai, hentikan stream yang baru terbentuk.
  if(session!==scanSession){try{controls.stop()}catch(e){};try{reader.reset()}catch(e){};return}
  barcodeControls=controls;
 }catch(e){if(session===scanSession)stopBarcodeScan();toast('Tidak dapat membuka kamera. Izinkan akses kamera pada aplikasi.')}
}
function stopBarcodeScan(){
 scanSession++;
 try{barcodeControls?.stop()}catch(e){};barcodeControls=null;
 try{barcodeReader?.reset()}catch(e){};barcodeReader=null;
 const v=$('#scanVideo');
 if(v?.srcObject){for(const track of v.srcObject.getTracks())track.stop();v.srcObject=null}
 closeM();
}
function grid(){const k=S.q.trim().toLowerCase();const l=P.filter(p=>(!S.cat||p.cat===S.cat)&&(!S.promo||prom(p))&&(!k||p.name.toLowerCase().includes(k)||p.sku.toLowerCase().includes(k)));
 if($('#cn'))$('#cn').textContent=l.length+' produk';$('#g').innerHTML=l.length?l.map(card).join(''):'<div class=empty>🔍<br>Produk tidak ditemukan</div>'}
function cats(){$('#v').innerHTML=`<div class=pad><h2>Kategori</h2>${CATS.length?`<div class=cg>${CATS.map(c=>`<div class=ct onclick="S.cat=this.dataset.c;S.promo=false;S.q='';go('home')" data-c="${esc(c)}"><i>▦</i><b>${esc(c)}</b><small>${P.filter(p=>p.cat===c).length} produk</small></div>`).join('')}</div>`:'<div class=empty>Belum ada kategori</div>'}</div>`}
function favs(){const l=P.filter(p=>S.fav.has(p.id));$('#v').innerHTML=`<div class=pad><h2>Favorit</h2></div><div class=grid>${l.length?l.map(card).join(''):'<div class=empty>♡<br>Belum ada favorit.<br>Ketuk ikon hati pada produk.</div>'}</div>`}

const closeM=()=>$('#m').classList.remove('on');$('#m').onclick=e=>{if(e.target.id==='m')closeM()};
function detail(id){const p=P.find(x=>x.id===id);sheet(`${p.url?`<img class=big src="${p.url}">`:'<div class=big></div>'}<h2 style="margin-top:14px">${esc(p.name)}</h2><small style="color:var(--mut)">SKU: ${esc(p.sku)}</small><div style="font-size:24px;margin:10px 0">${price(p)}</div>${prom(p)?`<b class=badge style="position:static;display:inline-block">PROMO -${pct(p)}%</b>`:''}<div class=kv><span>Kategori</span>${esc(p.cat)}</div><div class=kv><span>Status harga</span>${prom(p)?'Harga Promo':'Harga Normal'}</div><div class=kv><span>Harga normal</span>${rp(p.normal)}</div>${p.promo>0?`<div class=kv><span>Harga promo</span>${rp(p.promo)}</div>`:''}<div class=row style="margin-top:14px"><button class="btn o" onclick="fav('${p.id}');detail('${p.id}')">${S.fav.has(p.id)?'♥ Hapus favorit':'♡ Favorit'}</button><button class=btn onclick="closeM()">Tutup</button></div>`)}
/* ===== Gambar & Visual Search ===== */
async function proc(file){const b=await createImageBitmap(file);const sc=Math.min(1,800/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*sc);c.height=Math.round(b.height*sc);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));return{blob,hash:hashOf(b)}}
function hashOf(b){const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(b,0,0,8,8);const d=x.getImageData(0,0,8,8).data,v=[];for(let i=0;i<64;i++)v.push(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]);const a=v.reduce((s,n)=>s+n)/64;return v.map(n=>n>=a?'1':'0').join('')}
const dist=(a,b)=>{if(!a||!b||a.length!==b.length)return 64;let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d};
function vis(){$('#v').innerHTML=`<div class=pad><h2>Visual Search</h2><div class=row><button class=btn onclick="$('#fc').click()">📷 Kamera</button><button class="btn o" onclick="$('#fg').click()">🖼 Upload foto</button></div><input id=fc type=file accept="image/*" capture=environment hidden><input id=fg type=file accept="image/*" hidden><div id=vr style="color:var(--mut);text-align:center;margin-top:24px">Foto barang untuk mencari produk yang mirip. Hasil terbaik: barang di tengah, latar polos, cahaya cukup.</div></div><div id=g class=grid></div>`;
 const h=async e=>{const f=e.target.files[0];if(!f)return;const{blob,hash}=await proc(f);const r=P.filter(p=>p.hash).sort((a,b)=>dist(hash,a.hash)-dist(hash,b.hash)).slice(0,12);
  $('#vr').innerHTML=`<img src="${URL.createObjectURL(blob)}" style="height:90px;border-radius:12px"><br>Produk paling mirip`;$('#g').innerHTML=r.length?r.map(card).join(''):'<div class=empty>Belum ada produk berfoto</div>'};
 $('#fc').onchange=h;$('#fg').onchange=h}
/* ===== Profil & Admin ===== */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('niceso'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function setTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;localStorage.theme=t;me()}
function me(){const t=localStorage.theme||'auto';
 if(!S.admin){$('#nav').style.display='flex';let h=`<div class=pad><h2>Profil</h2><div class=pf><div class=av>👤</div><div><b>Pengunjung</b><br><small style="color:var(--mut)">Hanya melihat katalog</small></div></div><div class=sl>Tampilan</div><div class=seg>${['auto','light','dark'].map(x=>`<span class="${t===x?'on':''}" onclick="setTheme('${x}')">${{auto:'Otomatis',light:'Terang',dark:'Gelap'}[x]}</span>`).join('')}</div><div class=sl>Login Admin</div><div class=admin-login><div class=admin-brand><img src="assets/brand-logo.png" alt="NICESO"><div><b>Admin Portal</b><small>CATALOG MANAGEMENT</small></div></div><input id=em type=text placeholder="Email admin" autocapitalize=none><input id=pw type=password placeholder="Password"><button class="btn w" onclick="login()">Masuk ke Dashboard</button><small style="color:var(--mut)">Hanya admin yang perlu login. Pengguna biasa cukup membuka katalog.</small></div></div>`;$('#v').innerHTML=h;return}
 $('#nav').style.display='none';
 const menus=[['dash','▦','Dashboard'],['prod','▤','Produk'],['kat','▧','Kategori'],['data','⇧','Data']];
 const active=menus.find(x=>x[0]===S.adm)?.[2]||'Dashboard';
 $('#v').innerHTML=`<div class="admin-shell"><aside class="admin-side"><div class="admin-brand"><img src="assets/brand-logo.png" alt="NICESO"><div><b>CATALOG</b><small>MANAGEMENT PORTAL</small></div></div><div><div class="sl" style="margin:0 8px 10px">WORKSPACE</div><div class="admin-nav">${menus.map(x=>`<button class="${S.adm===x[0]?'on':''}" onclick="S.adm='${x[0]}';me()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div><div class="admin-side-foot">Signed in as <b style="color:var(--tx)">Admin</b><br><span>NICESO CATALOG</span></div></aside><main class="admin-main"><header class="admin-head"><div><h2>${active}</h2><p>Kelola katalog produk NICESO dengan lebih mudah.</p></div><div class="admin-head-actions"><button class="btn o" onclick="setTheme('${t==='dark'?'light':'dark'}')" title="Ganti tema">${t==='dark'?'☀️':'◐'} <span style="font-size:12px">Tema</span></button><button class="btn o" onclick="logout()">Keluar</button></div></header><div class="admin-tabs-mobile">${menus.map(x=>`<span class="chip ${S.adm===x[0]?'on':''}" onclick="S.adm='${x[0]}';me()">${x[2]}</span>`).join('')}</div><section class="admin-content">${admin()}</section></main></div>`;
}
async function chkAdmin(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data}=await sb.from('admins').select('user_id').eq('user_id',session.user.id);return !!(data&&data.length)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('Login gagal: '+error.message);if(!await chkAdmin()){await sb.auth.signOut();return toast('Akun ini bukan admin')}S.admin=true;me()}
async function logout(){await sb.auth.signOut();S.admin=false;me()}
function admin(){const a=S.adm;
 if(a==='dash'){
  const total=P.length,promo=P.filter(prom).length,without=P.filter(p=>!p.url).length,withPhoto=total-without;
  const counts=CATS.map(c=>({name:c,count:P.filter(p=>p.cat===c).length})).sort((x,y)=>y.count-x.count).slice(0,7),max=Math.max(1,...counts.map(x=>x.count));
  const recent=[...P].slice(-5).reverse();
  return `<div class="admin-kpis"><div class="admin-kpi"><div class="admin-kpi-top">Total Produk <span class="admin-kpi-icon">▤</span></div><strong>${total.toLocaleString('id-ID')}</strong><small>Seluruh produk dalam katalog</small></div><div class="admin-kpi"><div class="admin-kpi-top">Produk Promo <span class="admin-kpi-icon">％</span></div><strong>${promo.toLocaleString('id-ID')}</strong><small>Produk dengan harga promo aktif</small></div><div class="admin-kpi"><div class="admin-kpi-top">Kategori <span class="admin-kpi-icon">▦</span></div><strong>${CATS.length.toLocaleString('id-ID')}</strong><small>Kategori terdaftar</small></div><div class="admin-kpi"><div class="admin-kpi-top">Belum Ada Foto <span class="admin-kpi-icon">▧</span></div><strong>${without.toLocaleString('id-ID')}</strong><small>${total?Math.round(withPhoto/total*100):0}% produk sudah memiliki foto</small></div></div><div class="admin-panels"><div class="admin-panel"><h3>Distribusi kategori</h3><p>Jumlah produk berdasarkan kategori teratas</p><div class="cat-bars">${counts.length?counts.map(x=>`<div class="cat-bar-row"><span title="${esc(x.name)}">${esc(x.name)}</span><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round(x.count/max*100)}%"></div></div><span class="cat-bar-count">${x.count}</span></div>`).join(''):'<div class=empty>Belum ada data kategori</div>'}</div></div><div class="admin-panel"><h3>Cuplikan katalog</h3><p>Beberapa produk yang tersedia di katalog</p><div class="admin-recent">${recent.length?recent.map(p=>`<div class=li>${p.url?`<img src="${p.url}" alt="">`:'<span class=ph></span>'}<div><b>${esc(p.name)}</b><br><small>${esc(p.sku)} · ${esc(p.cat)}</small></div></div>`).join(''):'<div class=empty>Belum ada produk</div>'}</div><button class="btn o w" style="margin-top:12px" onclick="S.adm='prod';me()">Kelola semua produk</button></div></div>`}
 if(a==='prod')return `<div class="admin-toolbar"><input id="adminProductSearch" type="search" placeholder="Cari SKU atau nama produk..." oninput="adminProductFilter(this.value)"><button class="btn" style="flex:none" onclick="formP()">＋ Tambah Produk</button></div><div class="admin-list" id="adminProductList">${adminProductRows(P)}</div>`;
 if(a==='kat')return `<div class="admin-panel"><h3 class="admin-section-title">Kelola kategori</h3><div class=row><input id=nc type=text placeholder="Nama kategori baru"><button class=btn style="flex:none" onclick="addCat()">＋ Tambah</button></div>${CATS.map(c=>`<div class=li><div style="flex:1"><b>${esc(c)}</b><br><small style="color:var(--mut)">${P.filter(p=>p.cat===c).length} produk</small></div><button class="btn o" onclick="delCat(this.dataset.c)" data-c="${esc(c)}">Hapus</button></div>`).join('')||'<div class=empty>Belum ada kategori</div>'}</div>`;
 return `<div class="admin-panel"><h3>Impor dan ekspor data</h3><p>Kelola data katalog menggunakan file Excel.</p><button class="btn w" onclick="$('#xi').click()">↑ Import Excel</button><input id=xi type=file accept=".xlsx,.xls" hidden onchange="impX(event)"><button class="btn o w" onclick="expX()">↓ Export Excel</button><div class=sl>Keamanan akun</div><button class="btn o w" onclick="chpw()">Ganti password admin</button><p style="margin-top:14px">Kolom Excel: SKU | Nama Barang | Kategori | Harga Normal | Harga Promo | Status (PROMO/NORMAL). SKU yang sudah ada diperbarui (foto tetap). Foto ditambahkan lewat edit produk.</p></div>`}
function adminProductRows(list){return list.length?list.map(p=>`<div class=li>${p.url?`<img src="${p.url}" alt="">`:'<span class=ph></span>'}<div><b>${esc(p.name)}</b><br><small>${esc(p.sku)} · ${esc(p.cat)} · ${rp(cur(p))}${prom(p)?' · PROMO':''}</small></div><div class=admin-actions><button class="btn o" title="Edit" onclick="formP('${p.id}')">✎</button><button class="btn o" title="Hapus" onclick="rm('${p.id}')">⌫</button></div></div>`).join(''):'<div class=empty>Produk tidak ditemukan</div>'}
function adminProductFilter(q){const k=String(q||'').trim().toLowerCase();const list=P.filter(p=>p.name.toLowerCase().includes(k)||p.sku.toLowerCase().includes(k)||p.cat.toLowerCase().includes(k));const el=$('#adminProductList');if(el)el.innerHTML=adminProductRows(list)}
async function addCat(){const v=$('#nc').value.trim();if(!v)return;if(!ok(await sb.from('categories').upsert({name:v})))return;await load();me()}
async function delCat(c){if(!confirm('Hapus kategori "'+c+'"?'))return;if(!ok(await sb.from('categories').delete().eq('name',c)))return;await load();me()}
async function rm(id){if(!confirm('Hapus produk ini?'))return;if(!ok(await sb.from('products').delete().eq('id',id)))return;await sb.storage.from('products').remove([id+'.jpg']);await load();me()}
async function chpw(){const n=prompt('Password baru (min. 6 karakter)');if(!n)return;if(n.length<6)return toast('Terlalu pendek');if(ok(await sb.auth.updateUser({password:n})))toast('Password diganti')}
let F={};
function formP(id){const p=P.find(x=>x.id===id)||{};F={id:p.id,blob:null,hash:p.hash||'',url:p.url||''};
 sheet(`<h2>${id?'Edit':'Tambah'} Produk</h2><img id=pv class=big style="aspect-ratio:1.6" ${p.url?`src="${p.url}"`:''}><div class=row><button class="btn o" onclick="$('#pc').click()">📷 Kamera</button><button class="btn o" onclick="$('#pg').click()">🖼 Galeri</button></div><input id=pc type=file accept="image/*" capture=environment hidden><input id=pg type=file accept="image/*" hidden>
 <input id=fs type=text placeholder="SKU / Kode Barang" value="${esc(p.sku)}"><input id=fn type=text placeholder="Nama Barang" value="${esc(p.name)}"><input id=fk type=text list=dl placeholder="Kategori (pilih / ketik baru)" value="${esc(p.cat)}"><datalist id=dl>${CATS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <input id=fh type=number inputmode=numeric placeholder="Harga Normal" value="${p.normal??''}"><input id=fp type=number inputmode=numeric placeholder="Harga Promo (opsional)" value="${p.promo??''}"><label class=row style="margin:8px 0"><span style="flex:none"><input id=fo type=checkbox ${p.on?'checked':''}></span><span>Aktifkan harga promo</span></label>
 <div class=row><button class="btn o" onclick="closeM()">Batal</button><button id=sv class=btn onclick="saveP()">Simpan</button></div>`);
 const h=async e=>{const f=e.target.files[0];if(!f)return;const r=await proc(f);F.blob=r.blob;F.hash=r.hash;F.url=URL.createObjectURL(r.blob);$('#pv').src=F.url};$('#pc').onchange=h;$('#pg').onchange=h}
async function saveP(){const sku=$('#fs').value.trim(),name=$('#fn').value.trim(),cat=$('#fk').value.trim(),normal=parseFloat($('#fh').value),pr=$('#fp').value===''?null:parseFloat($('#fp').value),on=$('#fo').checked;
 if(!sku||!name||!cat)return toast('SKU, nama, dan kategori wajib diisi');if(isNaN(normal))return toast('Harga normal tidak valid');if(on&&!(pr>0))return toast('Isi harga promo atau matikan promo');
 if(P.some(p=>p.id!==F.id&&p.sku.toLowerCase()===sku.toLowerCase()))return toast('SKU sudah dipakai');
 const id=F.id||crypto.randomUUID();let url=F.url||null;$('#sv').disabled=true;
 try{if(F.blob){const up=await sb.storage.from('products').upload(id+'.jpg',F.blob,{upsert:true,contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;url=sb.storage.from('products').getPublicUrl(id+'.jpg').data.publicUrl+'?v='+Date.now()}
 const r=await sb.from('products').upsert({id,sku,name,cat,normal,promo:pr,promo_on:on,photo_url:url,hash:F.hash});if(r.error)throw r.error;
 await sb.from('categories').upsert({name:cat});await load();closeM();me();toast('Tersimpan')}catch(e){$('#sv').disabled=false;toast('Gagal: '+(e.message||e))}}
/* ===== Excel & Backup ===== */
async function saveFile(name,b64,mime){const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()){const{Filesystem,Share}=C.Plugins;const r=await Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await Share.share({title:name,url:r.uri})}else{const a=document.createElement('a');a.href=`data:${mime};base64,${b64}`;a.download=name;a.click()}}
async function expX(){if(typeof XLSX==='undefined')return toast('Library Excel belum termuat');const rows=[['SKU','Nama Barang','Kategori','Harga Normal','Harga Promo','Status (PROMO/NORMAL)'],...P.map(p=>[p.sku,p.name,p.cat,p.normal,p.promo??'',prom(p)?'PROMO':'NORMAL'])];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Produk');await saveFile('niceso_produk.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
async function impX(e){const f=e.target.files[0];if(!f)return;if(typeof XLSX==='undefined')return toast('Library Excel belum termuat');
 const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});const num=v=>{const x=parseFloat(String(v??'').replace(/[^0-9.]/g,''));return isNaN(x)?null:x};const m=new Map();
 for(const r of rows.slice(1)){const sku=String(r[0]??'').trim(),name=String(r[1]??'').trim();if(!sku||!name)continue;const pr=num(r[4]);m.set(sku,{sku,name,cat:String(r[2]||'Umum').trim(),normal:num(r[3])||0,promo:pr,promo_on:String(r[5]||'').toUpperCase()==='PROMO'&&pr>0})}
 const a=[...m.values()];toast('Mengimpor '+a.length+' produk...');
 for(let i=0;i<a.length;i+=300){if(!ok(await sb.from('products').upsert(a.slice(i,i+300),{onConflict:'sku'})))return}
 await sb.from('categories').upsert([...new Set(a.map(x=>x.cat))].map(name=>({name})));await load();me();toast(a.length+' produk diimpor')}

if(localStorage.theme&&localStorage.theme!=='auto')document.documentElement.dataset.theme=localStorage.theme;
(async()=>{try{await load()}catch(e){$('#v').innerHTML='<div class=pad>Tidak bisa memuat data. Periksa internet dan config.js.<br><small>'+esc(e.message||e)+'</small></div>';hideSplash();return}
 S.admin=await chkAdmin().catch(()=>false);render();hideSplash();
 await registerAndroidBackHandler();
 const rf=async()=>{try{await load()}catch(e){return}if(S.tab==='home')render(true);else if(S.tab==='cat'||S.tab==='fav')render()};
 sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'products'},rf).subscribe();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)rf()})})();
</script></body></html>
