name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - name: Pakai library Excel lokal (offline)
        run: |
          cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.js
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          sed -i 's#https://cdnjs[^"]*#xlsx.js#; s#https://cdn.jsdelivr[^"]*#supabase.js#' www/index.html
      - run: npx cap add android
      - run: python3 tool/patch_android.py
      - name: Buat ikon aplikasi
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ed1b24'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: niceso-catalog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
